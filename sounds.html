<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sounds — Shaykh AK</title>
<style>
  :root {
    --bg: #0D0D0D;
    --purple: #8B5CF6;
    --pink: #EC4899;
    --text: #F5F5F7;
    --muted: #A1A1AA;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .gradient-bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.35), transparent 45%),
                radial-gradient(circle at 80% 30%, rgba(236, 72, 153, 0.30), transparent 45%),
                radial-gradient(circle at 50% 80%, rgba(139, 92, 246, 0.25), transparent 50%),
                var(--bg);
    background-size: 200% 200%;
    animation: drift 18s ease-in-out infinite;
  }
  .gradient-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(139, 92, 246, 0.12), rgba(236, 72, 153, 0.12), rgba(139, 92, 246, 0.12));
    background-size: 300% 300%;
    animation: hue 12s ease infinite;
    mix-blend-mode: screen;
  }
  @keyframes drift {
    0%, 100% { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
    50% { background-position: 100% 100%, 0% 100%, 50% 0%, 0 0; }
  }
  @keyframes hue {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* Nav */
  nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 2rem;
    backdrop-filter: blur(10px);
    background: rgba(13, 13, 13, 0.55);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  nav .brand {
    font-weight: 700;
    letter-spacing: 0.14em;
    font-size: 0.95rem;
    text-transform: uppercase;
  }
  nav ul { list-style: none; display: flex; gap: 2rem; }
  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    transition: color 0.2s ease;
  }
  nav a:hover, nav a.active { color: var(--text); }

  /* Hamburger (hidden on desktop) */
  .nav-toggle {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 44px;
    height: 44px;
    padding: 10px;
    margin: -10px;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 20;
  }
  .nav-toggle span {
    display: block;
    width: 100%;
    height: 2px;
    border-radius: 2px;
    background: var(--text);
    transition: transform 0.3s ease, opacity 0.2s ease;
  }
  .nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  @media (max-width: 720px) {
    .nav-toggle { display: flex; }
    nav ul {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      flex-direction: column;
      gap: 0;
      padding: 0.4rem 0;
      background: rgba(13, 13, 13, 0.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transform: translateY(-8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    nav ul.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    nav ul li { width: 100%; }
    nav ul a { display: block; padding: 0.95rem 1.5rem; font-size: 1rem; }
  }

  /* Layout */
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 5rem;
  }

  .page-title {
    text-align: center;
    font-size: clamp(2rem, 7vw, 3.25rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 30px rgba(139,92,246,0.8), 0 0 60px rgba(236,72,153,0.5);
  }
  .page-sub {
    text-align: center;
    color: var(--muted);
    margin-top: 0.5rem;
    margin-bottom: 2.75rem;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
  }

  /* Player */
  .player {
    background: linear-gradient(160deg, rgba(139,92,246,0.14), rgba(236,72,153,0.10), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 26px;
    padding: 2rem;
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(139,92,246,0.15);
  }

  .art {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 300px;
    margin: 0 auto 1.75rem;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 50px rgba(139,92,246,0.5), 0 0 90px rgba(236,72,153,0.3);
    position: relative;
    overflow: hidden;
  }
  .art::after {
    content: "";
    position: absolute;
    inset: -40%;
    background: conic-gradient(from 0deg, rgba(255,255,255,0.0), rgba(255,255,255,0.35), rgba(255,255,255,0.0));
    animation: spin 6s linear infinite;
  }
  .art.paused::after { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .art .disc {
    position: relative;
    z-index: 1;
    width: 46%;
    height: 46%;
    border-radius: 50%;
    background: #0D0D0D;
    border: 6px solid rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
  }

  .track-title {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
  }
  .track-meta {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.25rem;
    letter-spacing: 0.05em;
  }

  /* Waveform visualizer */
  .viz-row {
    margin: 1.4rem 0 0.25rem;
  }
  #viz {
    display: block;
    width: 100%;
    height: 60px;
  }

  /* Progress */
  .progress-row {
    margin: 0.75rem 0 0.4rem;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    cursor: pointer;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px rgba(139,92,246,0.9), 0 0 20px rgba(236,72,153,0.7);
    transition: transform 0.15s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border: none;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px rgba(139,92,246,0.9), 0 0 20px rgba(236,72,153,0.7);
  }
  #seek { background: linear-gradient(90deg, var(--purple), var(--pink)) no-repeat; background-size: 0% 100%; }

  .time-row {
    display: flex;
    justify-content: flex-end;
    gap: 0;
    margin-top: 0.35rem;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: -0.02em;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .time-row #current { color: var(--text); }
  .time-row .time-sep { opacity: 0.6; white-space: pre; }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.75rem;
    margin-top: 1.25rem;
  }
  .controls button {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.15s ease, color 0.2s ease;
  }
  .controls button:hover { color: #fff; transform: scale(1.12); }
  .controls svg { width: 26px; height: 26px; fill: currentColor; }

  .play-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--purple), var(--pink)) !important;
    box-shadow: 0 0 25px rgba(139,92,246,0.6), 0 0 45px rgba(236,72,153,0.4);
  }
  .play-btn svg { width: 28px; height: 28px; fill: #fff; }

  /* Volume */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 1.5rem;
    max-width: 220px;
    margin-left: auto;
    margin-right: auto;
  }
  .volume-row svg { width: 18px; height: 18px; fill: var(--muted); flex-shrink: 0; }
  #volume { height: 5px; }
  #volume::-webkit-slider-thumb { width: 13px; height: 13px; }

  /* Playlist */
  .playlist {
    margin-top: 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .playlist h3 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 0.5rem;
    padding-left: 0.25rem;
  }
  .playlist { min-width: 0; }
  .pl-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    min-width: 0;
    padding: 0.85rem 1rem;
    border-radius: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .pl-item:hover { background: rgba(255,255,255,0.06); transform: translateX(4px); }
  .pl-item.active {
    background: linear-gradient(90deg, rgba(139,92,246,0.25), rgba(236,72,153,0.18));
    border-color: rgba(236,72,153,0.5);
  }
  .pl-index {
    width: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    font-variant-numeric: tabular-nums;
  }
  .pl-item.active .pl-index { color: var(--pink); }
  .pl-bars {
    display: none;
    gap: 2px;
    align-items: flex-end;
    height: 14px;
    width: 22px;
    justify-content: center;
  }
  .pl-item.active.playing .pl-bars { display: flex; }
  .pl-item.active.playing .pl-index { display: none; }
  .pl-bars span {
    width: 3px;
    background: var(--pink);
    border-radius: 2px;
    animation: eq 0.9s ease-in-out infinite;
  }
  .pl-bars span:nth-child(2) { animation-delay: 0.2s; }
  .pl-bars span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes eq {
    0%, 100% { height: 30%; }
    50% { height: 100%; }
  }
  .pl-info { flex: 1; min-width: 0; overflow: hidden; }
  .pl-name {
    display: block;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pl-item.active .pl-name { color: #fff; }
  .pl-artist {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .pl-dur {
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Sentinel that tells us when the full player has scrolled out of view */
  #playerTop { display: block; height: 1px; scroll-margin-top: 84px; }

  /* Compact sticky dock */
  .dock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.7rem 1.1rem calc(0.7rem + env(safe-area-inset-bottom, 0px));
    background: rgba(13, 13, 13, 0.82);
    backdrop-filter: blur(18px);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5), 0 -2px 30px rgba(139, 92, 246, 0.15);
    cursor: pointer;
    transform: translateY(110%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .dock.show { transform: translateY(0); }

  .dock-progress {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.12);
  }
  .dock-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    box-shadow: 0 0 10px rgba(236, 72, 153, 0.7);
  }

  .dock-play {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    box-shadow: 0 0 18px rgba(139, 92, 246, 0.55);
  }
  .dock-play svg { width: 20px; height: 20px; fill: #fff; }

  .dock-info { flex: 1; min-width: 0; }
  .dock-title {
    font-size: 0.9rem;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dock-time {
    font-size: 0.72rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .dock-chevron {
    width: 18px;
    height: 18px;
    fill: var(--muted);
    flex-shrink: 0;
  }

  body.dock-open { padding-bottom: 74px; }

  @media (max-width: 600px) {
    nav { padding: 1rem 1.25rem; }
    .wrap { padding: 2.5rem 1.15rem 4rem; }
    .player { padding: 1.4rem; border-radius: 20px; }
    .art { max-width: 220px; margin-bottom: 1.4rem; }
    .track-title { font-size: 1.1rem; }
    .controls { gap: 1.1rem; }
    .play-btn { width: 58px; height: 58px; }
    .volume-row { max-width: 100%; }
    .pl-item { padding: 0.75rem 0.85rem; gap: 0.7rem; }
    .dock { gap: 0.7rem; padding: 0.55rem 0.85rem calc(0.55rem + env(safe-area-inset-bottom, 0px)); }
    .dock-play { width: 38px; height: 38px; }
    .dock-chevron { display: none; }
  }

  /* Site footer */
  .site-footer {
    position: relative;
    margin-top: 3rem;
    padding: 2.75rem 1.5rem 3rem;
    background: rgba(9, 9, 12, 0.55);
    backdrop-filter: blur(8px);
  }
  .site-footer::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--purple), var(--pink), transparent);
  }
  .footer-inner {
    max-width: 620px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.35rem;
    text-align: center;
  }
  .footer-social {
    display: flex;
    gap: 0.9rem;
  }
  .footer-social a {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: var(--muted);
    border: 1px solid rgba(139, 92, 246, 0.35);
    transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .footer-social a:hover,
  .footer-social a:focus-visible {
    color: #fff;
    border-color: rgba(236, 72, 153, 0.75);
    transform: translateY(-2px);
    box-shadow: 0 0 18px rgba(236, 72, 153, 0.4);
    outline: none;
  }
  .footer-social svg { width: 19px; height: 19px; fill: currentColor; }
  .footer-email {
    color: var(--text);
    text-decoration: none;
    font-size: 0.92rem;
    letter-spacing: 0.02em;
    border-bottom: 1px solid rgba(236, 72, 153, 0.5);
    padding-bottom: 2px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .footer-email:hover { color: #fff; border-color: var(--pink); }
  .footer-copy {
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.6;
    letter-spacing: 0.02em;
  }
  @media (max-width: 600px) {
    .site-footer { padding: 2.25rem 1.25rem 2.5rem; }
    .footer-social a { width: 46px; height: 46px; }
  }

  /* Page loading animation */
  .page-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.75rem;
    background: var(--bg);
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .page-loader.loaded {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .loader-logo {
    font-size: clamp(1.8rem, 6vw, 3rem);
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #fff;
    text-shadow:
      0 0 4px rgba(255, 255, 255, 0.9),
      0 0 12px rgba(139, 92, 246, 1),
      0 0 30px rgba(139, 92, 246, 0.8),
      0 0 55px rgba(236, 72, 153, 0.6),
      0 0 90px rgba(236, 72, 153, 0.4);
    animation: loaderPulse 1.6s ease-in-out infinite;
  }
  @keyframes loaderPulse {
    0%, 100% { opacity: 0.85; filter: brightness(1); }
    50% { opacity: 1; filter: brightness(1.15); }
  }
  .loader-bar {
    position: relative;
    width: 180px;
    height: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  .loader-bar::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -40%;
    width: 40%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    box-shadow: 0 0 12px rgba(236, 72, 153, 0.6);
    animation: loaderSlide 1.1s ease-in-out infinite;
  }
  @keyframes loaderSlide {
    0% { left: -40%; }
    100% { left: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .loader-logo { animation: none; }
    .loader-bar::after { animation: none; left: 0; width: 100%; }
  }

  /* Scroll-triggered reveal */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .reveal.in {
    opacity: 1;
    transform: translateY(0);
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .reveal.in { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>
<div class="page-loader" id="pageLoader">
  <div class="loader-logo">Shaykh AK</div>
  <div class="loader-bar"></div>
</div>
<script>
  (function () {
    var loader = document.getElementById('pageLoader');
    if (!loader) return;
    var start = Date.now();
    var MIN_MS = 600;   // show at least this long so the animation reads
    var MAX_MS = 2200;  // never block the page longer than this
    var done = false;
    function hide() {
      if (done) return;
      done = true;
      var wait = Math.max(0, MIN_MS - (Date.now() - start));
      setTimeout(function () {
        loader.classList.add('loaded');
        setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 600);
      }, wait);
    }
    if (document.readyState === 'complete') hide();
    else window.addEventListener('load', hide);
    setTimeout(hide, MAX_MS);
  })();
</script>
<div class="gradient-bg"></div>

<nav>
  <span class="brand">Shaykh AK</span>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navMenu">
    <span></span><span></span><span></span>
  </button>
  <ul id="navMenu">
    <li><a href="index.html">Home</a></li>
    <li><a href="sounds.html" class="active">Sounds</a></li>
    <li><a href="booking.html">Book</a></li>
  </ul>
</nav>

<div class="wrap">
  <h1 class="page-title">Sounds</h1>
  <p class="page-sub">Lectures &amp; audio series</p>

  <span id="playerTop" aria-hidden="true"></span>
  <div class="player" id="player">
    <div class="art paused" id="art">
      <div class="disc">&#9835;</div>
    </div>

    <div class="track-title" id="trackTitle">—</div>
    <div class="track-meta" id="trackMeta">Track 0 of 5</div>

    <div class="viz-row">
      <canvas id="viz" aria-hidden="true"></canvas>
    </div>

    <div class="progress-row">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
    </div>
    <div class="time-row">
      <span id="current">0:00</span><span class="time-sep"> / </span><span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="prev" aria-label="Previous track">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="back15" aria-label="Back 15 seconds">
        <svg viewBox="0 0 24 24"><path d="M11 6V2L5 8l6 6V9c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H3c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
      </button>
      <button class="play-btn" id="playPause" aria-label="Play or pause">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="fwd15" aria-label="Forward 15 seconds">
        <svg viewBox="0 0 24 24"><path d="M13 6V2l6 6-6 6V9c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6h2c0 4.4-3.6 8-8 8s-8-3.6-8-8 3.6-8 8-8z"/></svg>
      </button>
      <button id="next" aria-label="Next track">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-9.5 6L15 6v12z"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4z"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
    </div>

    <div class="playlist" id="playlist">
      <h3>Playlist</h3>
    </div>
  </div>
</div>

<div class="dock" id="dock" role="button" tabindex="0" aria-label="Expand full player">
  <div class="dock-progress"><div class="dock-fill" id="dockFill"></div></div>
  <button class="dock-play" id="dockPlay" aria-label="Play or pause">
    <svg viewBox="0 0 24 24" id="dockIcon"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="dock-info">
    <div class="dock-title" id="dockTitle">—</div>
    <div class="dock-time"><span id="dockCurrent">0:00</span> / <span id="dockDuration">0:00</span></div>
  </div>
  <svg class="dock-chevron" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5z"/></svg>
</div>

<audio id="audio" preload="metadata"></audio>
<audio id="audioFade" preload="none"></audio>

<script>
  // Audio hosted on Cloudflare R2 (bucket: vibe-codeprojects, folder: ShaykhAK-Sounds).
  const AUDIO_BASE = "https://pub-28c7b7eb35a2451cb3a140ee05a39972.r2.dev/ShaykhAK-Sounds/";
  const tracks = [
    {
      title: "The Creed of the People of Hadith Regarding the Attributes of Allah — Part 1",
      artist: "Shaykh Abu Khadeejah · Summer Conference 2026",
      src: AUDIO_BASE + "Summer Conf 2026 Part 1 The Creed of the People of Hadith Regarding the Attributes of Allah By Sh Abu Khadeejah.mp3"
    },
    {
      title: "The Creed of the People of Hadith Regarding the Attributes of Allah — Part 2",
      artist: "Shaykh Abu Khadeejah · Summer Conference 2026",
      src: AUDIO_BASE + "Summer Conf 2026 Part 2 The Creed of the People of Hadith Regarding the Attributes of Allah By Sh Abu Khadeejah.mp3"
    },
    {
      title: "This is My Straight Path, so Follow it, and do not Follow the Other Paths",
      artist: "Shaykh Abu Khadeejah",
      src: AUDIO_BASE + "This is My Straight Path so Follow it, and do not Follow the Other Paths By Sh Abu Khadeejah.mp3"
    },
    {
      title: "“Whoever obeys Allah and His Messenger will be with the Prophets…”",
      artist: "Shaykh Abu Khadeejah",
      src: AUDIO_BASE + "“Whoever obeys Allah and His Messenger will be with the Prophets…” By Abu Khadeejah.mp3"
    },
    {
      title: "Final Advice — Summer Conference 2026",
      artist: "Shaykh Abu Khadeejah & Shaykh Abu Hafsah",
      src: AUDIO_BASE + "Summer Conf 2026 Final Advice Sh Abu Khadeejah Sh Abu Hafsah.mp3"
    }
  ];

  const audio      = document.getElementById('audio');
  const fadeEl     = document.getElementById('audioFade');
  const art        = document.getElementById('art');
  const trackTitle = document.getElementById('trackTitle');
  const trackMeta  = document.getElementById('trackMeta');
  const seek       = document.getElementById('seek');
  const currentEl  = document.getElementById('current');
  const durationEl  = document.getElementById('duration');
  const playPause  = document.getElementById('playPause');
  const playIcon   = document.getElementById('playIcon');
  const volume     = document.getElementById('volume');
  const playlistEl = document.getElementById('playlist');

  const player      = document.getElementById('player');
  const playerTop   = document.getElementById('playerTop');
  const dock        = document.getElementById('dock');
  const dockPlay    = document.getElementById('dockPlay');
  const dockIcon    = document.getElementById('dockIcon');
  const dockTitle   = document.getElementById('dockTitle');
  const dockCurrent = document.getElementById('dockCurrent');
  const dockDuration = document.getElementById('dockDuration');
  const dockFill    = document.getElementById('dockFill');

  let index = 0;
  let isSeeking = false;
  let playWhenReady = false;
  let started = false;      // becomes true after the first play
  let playerVisible = true; // is the full player in the viewport?

  let userVolume = parseFloat(volume.value); // volume the slider is set to
  const CROSSFADE_MS = 500;
  let fade = null;          // active crossfade state, or null
  let fadeRAF = null;
  let pendingFadeIn = false;
  const smoothstep = (k) => k * k * (3 - 2 * k);

  // --- Web Audio frequency visualizer ---
  const BAR_COUNT = 48;
  const vizCanvas = document.getElementById('viz');
  const vizCtx = vizCanvas.getContext('2d');
  const bars = new Float32Array(BAR_COUNT);   // current (eased) bar heights, 0..1
  let audioCtx, analyser, freqData, vizRAF, vizGradient;
  let vizDisabled = false;

  function ensureAudioGraph() {
    if (audioCtx || vizDisabled) return;
    // A MediaElementAudioSource routes ALL playback through the graph, and the
    // graph outputs pure silence whenever the media is cross-origin without CORS
    // (that includes file:// and the R2 bucket, which sends no CORS header). So
    // only wire up the analyser for same-origin, served audio — otherwise leave
    // the element untouched so it plays, and the bars run the synth fallback.
    if (location.protocol !== 'http:' && location.protocol !== 'https:') {
      vizDisabled = true;
      return;
    }
    try {
      if (new URL(tracks[index].src, location.href).origin !== location.origin) {
        vizDisabled = true;                   // cross-origin audio (Cloudflare R2)
        return;
      }
    } catch (e) { vizDisabled = true; return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { vizDisabled = true; return; }
    try {
      audioCtx = new AC();
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;                 // 128 frequency bins
      analyser.smoothingTimeConstant = 0.8;
      freqData = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);
      analyser.connect(audioCtx.destination); // keep sound audible
    } catch (e) {
      audioCtx = null;
      vizDisabled = true;                     // visualizer just stays flat
    }
  }

  function resizeViz() {
    const dpr = window.devicePixelRatio || 1;
    const w = vizCanvas.clientWidth;
    const h = vizCanvas.clientHeight;
    vizCanvas.width = Math.round(w * dpr);
    vizCanvas.height = Math.round(h * dpr);
    vizCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    vizGradient = vizCtx.createLinearGradient(0, h, 0, 0);
    vizGradient.addColorStop(0, '#8B5CF6');   // purple at the base
    vizGradient.addColorStop(1, '#EC4899');   // pink at the tips
  }

  function drawViz() {
    const w = vizCanvas.clientWidth;
    const h = vizCanvas.clientHeight;
    vizCtx.clearRect(0, 0, w, h);
    vizCtx.fillStyle = vizGradient;
    const gap = 3;
    const bw = (w - gap * (BAR_COUNT - 1)) / BAR_COUNT;
    const r = Math.min(bw / 2, 3);
    for (let i = 0; i < BAR_COUNT; i++) {
      const bh = Math.max(2, bars[i] * h);
      const x = i * (bw + gap);
      const y = h - bh;
      vizCtx.beginPath();
      vizCtx.moveTo(x, y + r);
      vizCtx.arcTo(x, y, x + r, y, r);
      vizCtx.arcTo(x + bw, y, x + bw, y + r, r);
      vizCtx.lineTo(x + bw, h);
      vizCtx.lineTo(x, h);
      vizCtx.closePath();
      vizCtx.fill();
    }
  }

  // Per-bar random phase for the synthesized fallback.
  const vizSeed = Array.from({ length: BAR_COUNT }, () => Math.random() * Math.PI * 2);

  function vizFrame() {
    const playing = !audio.paused && !audio.ended;
    const useAnalyser = analyser && playing;
    if (useAnalyser) analyser.getByteFrequencyData(freqData);
    const t = performance.now() / 1000;
    let moving = false;
    for (let i = 0; i < BAR_COUNT; i++) {
      let target = 0;
      if (useAnalyser) {
        // Sample low-to-mid bins (skip bin 0-1 sub-bass); speech lives here.
        target = freqData[i + 2] / 255;
      } else if (playing) {
        // No real spectrum available (e.g. opened from disk) — animate a
        // lively pseudo-waveform so the bars still respond while playing.
        const wobble = Math.sin(vizSeed[i] + t * 6) * Math.sin(i * 0.7 - t * 3.3);
        const envelope = 0.35 + 0.45 * Math.abs(Math.sin(i * 0.28 + t * 1.6));
        target = Math.max(0.05, envelope * Math.abs(wobble));
      }
      bars[i] += (target - bars[i]) * 0.35;
      if (Math.abs(target - bars[i]) > 0.004) moving = true;
    }
    drawViz();
    if (playing || moving) {
      vizRAF = requestAnimationFrame(vizFrame);
    } else {
      vizRAF = null;
    }
  }

  function startViz() {
    if (!vizRAF) vizRAF = requestAnimationFrame(vizFrame);
  }

  resizeViz();
  drawViz();
  window.addEventListener('resize', () => { resizeViz(); drawViz(); });

  const PLAY_PATH  = "M8 5v14l11-7z";
  const PAUSE_PATH = "M6 5h4v14H6zm8 0h4v14h-4z";

  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    t = Math.floor(t);
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = t % 60;
    if (h > 0) return h + ":" + String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
    return m + ":" + String(s).padStart(2, '0');
  }

  // Build playlist
  tracks.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 'pl-item';
    item.dataset.i = i;
    item.innerHTML = `
      <span class="pl-index">${i + 1}</span>
      <span class="pl-bars"><span></span><span></span><span></span></span>
      <span class="pl-info">
        <span class="pl-name">${t.title}</span>
        <span class="pl-artist">${t.artist || ''}</span>
      </span>
      <span class="pl-dur" data-dur="${i}">--:--</span>
    `;
    item.addEventListener('click', () => { crossfadeTo(i); });
    playlistEl.appendChild(item);

    // Probe duration with a detached audio element
    const probe = new Audio();
    probe.preload = 'metadata';
    probe.src = encodeURI(t.src);
    probe.addEventListener('loadedmetadata', () => {
      const cell = playlistEl.querySelector(`[data-dur="${i}"]`);
      if (cell && isFinite(probe.duration)) cell.textContent = fmt(probe.duration);
    });
  });

  // Update the visible track info without touching playback (used to keep the
  // title responsive while rapid skips are still being debounced).
  function showTrackInfo(i) {
    const t = tracks[i];
    trackTitle.textContent = t.title;
    dockTitle.textContent = t.title;
    trackMeta.textContent = (t.artist ? t.artist + '  ·  ' : '') +
      `Track ${i + 1} of ${tracks.length}`;
    seek.value = 0;
    seek.style.backgroundSize = '0% 100%';
    currentEl.textContent = '0:00';
    durationEl.textContent = '0:00';
    dockCurrent.textContent = '0:00';
    dockDuration.textContent = '0:00';
    dockFill.style.width = '0%';
    document.querySelectorAll('.pl-item').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.i) === i);
    });
  }

  function load(i, autoplay = false, fadeIn = false) {
    index = (i + tracks.length) % tracks.length;
    playWhenReady = autoplay;
    audio.volume = fadeIn ? 0 : userVolume;
    audio.src = encodeURI(tracks[index].src);
    audio.load();
    showTrackInfo(index);
    updatePlayingClass();
  }

  function play() {
    ensureAudioGraph();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    const p = audio.play();
    if (p && p.catch) p.catch(() => { /* autoplay blocked or source not ready */ });
    watchdogAudio();
  }

  // Public skip entry point. The first skip fires immediately; further skips
  // that arrive while a crossfade is still running are coalesced so a burst of
  // clicks results in a single load of the final track.
  let skipTimer = null;
  let skipTarget = null;
  function crossfadeTo(i) {
    const target = (i + tracks.length) % tracks.length;
    if (fade || skipTimer) {
      skipTarget = target;
      showTrackInfo(target);
      if (skipTimer) clearTimeout(skipTimer);
      skipTimer = setTimeout(() => {
        skipTimer = null;
        if (skipTarget !== index) doCrossfade(skipTarget);
      }, 280);
      return;
    }
    doCrossfade(target);
  }

  // Skip to another track with a 0.5s crossfade: the outgoing track keeps
  // playing on a second element and fades out while the new one fades in.
  function doCrossfade(i) {
    // Only spin up the fading tail when the main element is actually playing and
    // no crossfade is already running — chained rapid skips just fade the new
    // track in, so a second big download never competes with the incoming one.
    const canTail = !fade && !audio.paused && !audio.ended && audio.currentTime > 0.1;
    const outSrc = audio.src;
    const outAt = audio.currentTime;
    const outVol = audio.volume > 0.001 ? audio.volume : userVolume;

    // Start the incoming track loading first so it isn't starved by the tail.
    pendingFadeIn = true;
    load(i, true, true);                 // new track loads muted, then fades in

    if (canTail) {
      try {
        fadeEl.src = outSrc;
        fadeEl.addEventListener('loadedmetadata', function seekOnce() {
          fadeEl.removeEventListener('loadedmetadata', seekOnce);
          try { fadeEl.currentTime = outAt; } catch (e) {}
        }, { once: true });
        try { fadeEl.currentTime = outAt; } catch (e) {}
        fadeEl.volume = outVol;
        const fp = fadeEl.play();
        if (fp && fp.catch) fp.catch(() => {});
      } catch (e) { /* fall back to a plain fade-in */ }
    } else {
      try { fadeEl.pause(); } catch (e) {}
    }

    fade = { fadeOut: canTail, outStart: outVol, outT0: performance.now(), inT0: 0 };
    if (!fadeRAF) fadeRAF = requestAnimationFrame(fadeStep);
  }

  function fadeStep(now) {
    if (!fade) { fadeRAF = null; return; }
    let done = true;

    if (fade.fadeOut) {
      const k = Math.min(1, (now - fade.outT0) / CROSSFADE_MS);
      fadeEl.volume = Math.max(0, fade.outStart * (1 - smoothstep(k)));
      if (k < 1) done = false;
      else if (!fadeEl.paused) {
        try { fadeEl.pause(); } catch (e) {}
      }
    }

    if (fade.inT0) {
      const k = Math.min(1, (now - fade.inT0) / CROSSFADE_MS);
      audio.volume = Math.min(1, userVolume * smoothstep(k));
      if (k < 1) done = false;
    } else if (now - fade.outT0 < 2500) {
      done = false;                     // still waiting for the new track to start
    } else {
      audio.volume = userVolume;        // safety: playback never started
    }

    if (done) {
      audio.volume = userVolume;
      fade = null;
      fadeRAF = null;
    } else {
      fadeRAF = requestAnimationFrame(fadeStep);
    }
  }

  // Safety net: if the analyser graph ever ends up muting playback (some browsers
  // silence a MediaElementAudioSource), tear the graph down so the plain <audio>
  // element takes over. Runs once, only in the first couple of seconds.
  let watchdogDone = false;
  function watchdogAudio() {
    if (watchdogDone || !audioCtx || !analyser) return;
    watchdogDone = true;
    let silentChecks = 0;
    const timer = setInterval(() => {
      if (audio.paused) return;
      if (audio.currentTime < 0.4) return;
      analyser.getByteFrequencyData(freqData);
      let max = 0;
      for (let i = 0; i < freqData.length; i++) if (freqData[i] > max) max = freqData[i];
      if (max === 0) {
        if (++silentChecks >= 4) {           // ~1s of playback with zero signal
          clearInterval(timer);
          try { audioCtx.close(); } catch (e) {}
          audioCtx = null; analyser = null; vizDisabled = true;
        }
      } else {
        clearInterval(timer);                // audio is flowing, all good
      }
      if (audio.currentTime > 3) clearInterval(timer);
    }, 250);
  }
  function pause() { playWhenReady = false; audio.pause(); }

  function updatePlayingClass() {
    const playing = !audio.paused;
    playIcon.setAttribute('d', playing ? PAUSE_PATH : PLAY_PATH);
    dockIcon.setAttribute('d', playing ? PAUSE_PATH : PLAY_PATH);
    art.classList.toggle('paused', !playing);
    document.querySelectorAll('.pl-item').forEach(el => {
      el.classList.toggle('playing', playing && el.classList.contains('active'));
    });
  }

  // Show the compact dock only once playback has begun AND the full player
  // has been scrolled out of view.
  function syncDock() {
    dock.classList.toggle('show', started && !playerVisible);
    document.body.classList.toggle('dock-open', started && !playerVisible);
  }

  playPause.addEventListener('click', () => {
    if (audio.paused) {
      // If the track is still buffering, queue playback for when it's ready.
      if (audio.readyState < 3) playWhenReady = true;
      play();
    } else {
      pause();
    }
  });
  document.getElementById('next').addEventListener('click', () => { crossfadeTo(index + 1); });
  document.getElementById('prev').addEventListener('click', () => {
    if (audio.currentTime > 3) { audio.currentTime = 0; }
    else { crossfadeTo(index - 1); }
  });
  document.getElementById('fwd15').addEventListener('click', () => {
    audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15);
  });
  document.getElementById('back15').addEventListener('click', () => {
    audio.currentTime = Math.max(0, audio.currentTime - 15);
  });

  audio.addEventListener('play', () => {
    updatePlayingClass();
    startViz();
    if (!started) { started = true; syncDock(); }
    if (pendingFadeIn && fade) {
      pendingFadeIn = false;
      fade.inT0 = performance.now();     // begin the fade-in now that sound is flowing
      if (!fadeRAF) fadeRAF = requestAnimationFrame(fadeStep);
    }
  });
  audio.addEventListener('pause', updatePlayingClass);

  // Auto-advance: when a track finishes, fade the next one in; wrap after the last.
  audio.addEventListener('ended', () => {
    crossfadeTo((index + 1) % tracks.length);
  });

  // Once a freshly-loaded track has buffered enough, start it if playback was requested.
  audio.addEventListener('canplay', () => {
    if (playWhenReady) {
      playWhenReady = false;
      play();
    }
  });

  audio.addEventListener('loadedmetadata', () => {
    durationEl.textContent = fmt(audio.duration);
    dockDuration.textContent = fmt(audio.duration);
  });

  audio.addEventListener('error', () => {
    playWhenReady = false;
    trackMeta.textContent = 'Audio unavailable — check the audio/ folder';
    art.classList.add('paused');
  });

  audio.addEventListener('timeupdate', () => {
    if (isSeeking) return;
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    seek.value = pct;
    seek.style.backgroundSize = pct + '% 100%';
    currentEl.textContent = fmt(audio.currentTime);
    dockFill.style.width = pct + '%';
    dockCurrent.textContent = fmt(audio.currentTime);
  });

  seek.addEventListener('input', () => {
    isSeeking = true;
    seek.style.backgroundSize = seek.value + '% 100%';
    if (audio.duration) currentEl.textContent = fmt((seek.value / 100) * audio.duration);
  });
  seek.addEventListener('change', () => {
    if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
    isSeeking = false;
  });

  volume.addEventListener('input', () => {
    userVolume = parseFloat(volume.value);
    if (!fade) audio.volume = userVolume;   // during a crossfade the ramp owns the volume
    volume.style.backgroundSize = (userVolume * 100) + '% 100%';
  });
  audio.volume = userVolume;
  volume.style.backgroundSize = (userVolume * 100) + '% 100%';

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); playPause.click(); }
    if (e.code === 'ArrowRight') audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15);
    if (e.code === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 15);
  });

  // --- Sticky compact dock ---

  // Mini play/pause mirrors the main button but never expands the player.
  dockPlay.addEventListener('click', (e) => {
    e.stopPropagation();
    playPause.click();
  });

  // Scrub straight from the dock's progress strip.
  dock.querySelector('.dock-progress').addEventListener('click', (e) => {
    e.stopPropagation();
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  });

  function expandPlayer() {
    playerTop.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  dock.addEventListener('click', expandPlayer);
  dock.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); expandPlayer(); }
  });

  // Track whether the full player is on screen; the dock fills in when it isn't.
  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      playerVisible = entries[0].isIntersecting;
      syncDock();
    }, { rootMargin: '-80px 0px -96px 0px' }).observe(player);
  }

  load(0);

  // Mobile nav
  (function () {
    var toggle = document.getElementById('navToggle');
    var menu = document.getElementById('navMenu');
    if (!toggle || !menu) return;
    function setOpen(open) {
      menu.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    toggle.addEventListener('click', function () { setOpen(!menu.classList.contains('open')); });
    menu.addEventListener('click', function (e) { if (e.target.tagName === 'A') setOpen(false); });
    document.addEventListener('click', function (e) {
      if (!menu.contains(e.target) && !toggle.contains(e.target)) setOpen(false);
    });
    window.addEventListener('resize', function () { if (window.innerWidth > 720) setOpen(false); });
  })();

</script>

<script>
  // Fade sections up as they scroll into view; gig cards / form fields stagger.
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
        !('IntersectionObserver' in window)) return;

    function reveal(el, delay) {
      setTimeout(function () {
        el.classList.add('in');
        var clean = function () {
          el.removeEventListener('transitionend', clean);
          el.classList.remove('reveal', 'in');
        };
        el.addEventListener('transitionend', clean);
        setTimeout(clean, 900);          // fallback if transitionend never fires
      }, delay || 0);
    }

    // Elements revealed individually as each scrolls into view.
    var singles = document.querySelectorAll(
      '.hero .tagline, .hero .btn-book, .classes h2, .classes .sub, ' +
      '.page-title, .page-sub, .player, .footer-inner'
    );
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        io.unobserve(e.target);
        reveal(e.target, 0);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    Array.prototype.forEach.call(singles, function (el) {
      el.classList.add('reveal');
      io.observe(el);
    });

    // Staggered groups: when the container appears, its children fade up one by one.
    [['.scroller', '.card'], ['#bookingForm', '.field']].forEach(function (pair) {
      var container = document.querySelector(pair[0]);
      if (!container) return;
      var kids = container.querySelectorAll(pair[1]);
      if (!kids.length) return;
      Array.prototype.forEach.call(kids, function (el) { el.classList.add('reveal'); });
      var group = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          group.disconnect();
          Array.prototype.forEach.call(kids, function (el, i) {
            reveal(el, Math.min(i, 8) * 90);
          });
        });
      }, { threshold: 0.1 });
      group.observe(container);
    });
  })();
</script>
